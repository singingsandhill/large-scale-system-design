site_name: 대규모 시스템 설계 기초 스터디
site_description: '『가상 면접 사례로 배우는 대규모 시스템 설계 기초』를 함께 읽고 하나의 Spring Boot 서비스에 적용해 보는 스터디 기록'
site_url: https://singingsandhill.github.io/large-scale-system-design/

repo_url: https://github.com/singingsandhill/large-scale-system-design
repo_name: singingsandhill/large-scale-system-design
# 기본값이 edit/master/docs/ 라서 반드시 명시해야 한다. 없으면 "이 페이지 수정" 링크가 전부 404.
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ko
  features:
    - navigation.instant   # site_url 이 설정되어 있어야 동작한다
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit  # repo_url + edit_uri 필요
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 시스템 설정 따르기
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환

plugins:
  # 한국어 검색은 theme.language: ko 로 자동 처리된다.
  # separator 를 직접 쓰거나 jieba(중국어 전용)를 넣지 말 것.
  - search

markdown_extensions:
  # ⚠️ 한글 제목의 앵커를 살리기 위해 반드시 필요하다.
  #    Python-Markdown 기본 slugify 는 non-ASCII 를 버려서
  #    "## 처리량 추정" 의 앵커가 #_1, #_2 처럼 의미 없는 값이 된다.
  #    나중에 바꾸면 기존 링크가 전부 깨지므로 처음부터 고정한다.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  # Mermaid 다이어그램: Material 내장 통합. 추가 pip 패키지가 필요 없고,
  # mkdocs-mermaid2-plugin 을 함께 쓰면 충돌한다.
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# mkdocs build --strict 는 WARNING 이 하나라도 있으면 실패한다.
# 아래 값들은 "무엇을 WARNING 으로 볼지"를 정한다.
validation:
  nav:
    omitted_files: info   # nav 에 아직 안 넣은 새 문서는 통과시킨다
    not_found: warn       # nav 가 가리키는 파일이 없으면 CI 실패
    absolute_links: warn
  links:
    not_found: warn       # 깨진 상대 링크는 CI 실패
    anchors: warn         # 존재하지 않는 #앵커도 CI 실패
    absolute_links: warn  # /로 시작하는 링크는 Pages 하위 경로에서 깨진다
    unrecognized_links: warn

nav:
  - Home: index.md
  - Study:
      - Introduction: study/introduction.md
      - Rules: study/rules.md
      - Schedule: study/schedule.md
  - Chapters: chapters/README.md
  - Architecture:
      - Current: architecture/current.md
      - Evolution: architecture/evolution.md
      - ADR: architecture/adr/README.md
  - Playground: playground/README.md
  - Retrospectives: retrospectives/README.md
