name: "🧪 Experiment"
description: "가설을 세우고 측정으로 확인하는 실험."
title: "[Exp] "
labels: ["experiment"]
body:
  - type: markdown
    attributes:
      value: |
        측정하지 않은 주장은 이 저장소에서 근거가 되지 않습니다.
        결과는 `docs/chapters/<chapter>/experiment.md` 또는 `docs/playground/` 에 남깁니다.

  - type: input
    id: related-chapter
    attributes:
      label: 관련 장 · 이슈
      description: 장 번호와 Chapter 이슈 번호를 함께 적어주세요.
      placeholder: "6장 (#12)"
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: 가설
      description: 반증 가능한 한 문장으로.
      placeholder: "가상 노드를 100개로 늘리면 노드 1대 추가 시 재배치되는 키 비율이 1/N ± 2%p 안으로 들어온다."
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: 실험 구성
      description: 데이터 규모, 실행 환경, 고정한 변수와 바꾸는 변수.
      placeholder: |
        - 대상 코드 · 모듈:
        - 데이터 규모:
        - 고정 변수:
        - 조작 변수:
        - 실행 환경 (JDK 21 / 로컬 / CI):
    validations:
      required: true

  - type: input
    id: metric
    attributes:
      label: 측정 지표
      description: 단위까지 적어주세요.
      placeholder: "재배치 키 비율(%), p99 지연(ms), 처리량(req/s)"
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: 성공 · 실패 판정 기준
      description: 어떤 숫자면 가설이 맞고 어떤 숫자면 틀렸다고 볼지, 돌리기 전에 정하세요.
      placeholder: |
        - 성공: 재배치 비율 ≤ 12%
        - 실패: 20% 초과
    validations:
      required: true

  - type: dropdown
    id: tooling
    attributes:
      label: 사용할 도구
      description: 여러 개 선택할 수 있습니다.
      multiple: true
      options:
        - JUnit 5 · Spring Boot Test
        - JMH (마이크로벤치마크)
        - Actuator · Micrometer
        - Spring Modulith observability
        - k6 · Gatling · wrk · ab
        - 직접 작성한 스크립트
        - 기타
    validations:
      required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: 예상 결과
      description: 돌리기 전에 먼저 적어두면 나중에 자신을 속이기 어려워집니다.
    validations:
      required: true

  - type: checkboxes
    id: done
    attributes:
      label: 완료 조건
      options:
        - label: "원시 측정값을 문서에 기록"
        - label: "재현 명령어 기록 (experiments/ 아래 스크립트 포함)"
        - label: "가설이 맞았는지 · 틀렸는지 결론 한 문장"
